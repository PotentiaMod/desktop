name: Build (Auto)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Prepare extensions
      # Don't need to do a full fetch, that would just cause a lot of unnecessary traffic
    - name: Prepare TurboWarp extensions
      run: node scripts/prepare-extensions.mjs
    - name: Prepare PotentiaMod extensions
      run: node scripts/prepare-pot-extensions.mjs
    - name: Prepare Astra Editor extensions
      run: node scripts/prepare-ae-extensions.mjs
    - name: Prepare other extensions
      run: node scripts/prepare-other-extensions.mjs
    - name: Prepare Ark IDE extensions
      run: node scripts/prepare-ark-extensions.mjs
    - name: Prepare Bilup extensions
      run: node scripts/prepare-bilup-extensions.mjs
    - name: Prepare Dash extensions
      run: node scripts/prepare-dash-extensions.mjs
    - name: Prepare DinosaurMod extensions
      run: node scripts/prepare-dm-extensions.mjs
    - name: Prepare ElectraMod extensions
      run: node scripts/prepare-em-extensions.mjs
    - name: Prepare GaiaMod extensions
      run: node scripts/prepare-gm-extensions.mjs
    - name: Prepare Mistium extensions
      run: node scripts/prepare-mw-extensions.mjs
    - name: Prepare NitroBolt extensions
      run: node scripts/prepare-nb-extensions.mjs
    - name: Prepare PenguinMod extensions
      run: node scripts/prepare-pm-extensions.mjs
    - name: Prepare Snail IDE extensions
      run: node scripts/prepare-sn-extensions.mjs
    - name: Prepare SharkPool extensions
      run: node scripts/prepare-sp-extensions.mjs
    - name: Prepare 02Engine extensions
      run: node scripts/prepare-ztengine-extensions.mjs
    - name: Compile
      run: npm run webpack:compile
    - name: Package
      run: npm run electron:package:dir
