name: Build (Auto)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Prepare extensions
      # Don't need to do a full fetch, that would just cause a lot of unnecessary traffic
      run: node scripts/prepare-extensions.mjs
      run: node scripts/prepare-ae-extensions.mjs
      run: node scripts/prepare-am-extensions.mjs
      run: node scripts/prepare-ark-extensions.mjs
      run: node scripts/prepare-bilup-extensions.mjs
      run: node scripts/prepare-dash-extensions.mjs
      run: node scripts/prepare-dm-extensions.mjs
      run: node scripts/prepare-em-extensions.mjs
      run: node scripts/prepare-gm-extensions.mjs
      run: node scripts/prepare-mw-extensions.mjs
      run: node scripts/prepare-nb-extensions.mjs
      run: node scripts/prepare-pm-extensions.mjs
      run: node scripts/prepare-sn-extensions.mjs
      run: node scripts/prepare-sp-extensions.mjs
      run: node scripts/prepare-ztengine-extensions.mjs
    - name: Compile
      run: npm run webpack:compile
    - name: Package
      run: npm run electron:package:dir
