  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install strip-nondeterminism
      run: sudo apt-get install strip-nondeterminism
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Fetch
      run: npm run fetch
    - name: Compile
      run: npm run webpack:prod
    - name: Package (deb, tarball, AppImage)
      run: node release-automation/build.mjs --debian --tarball --appimage --x64 --production
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload to release
      run: gh release upload "${{ needs.create-release.outputs.tag }}" dist/*.deb dist/*.tar.gz dist/*.AppImage --repo PotentiaMod/desktop --clobber
      env:
        GH_TOKEN: "${{ github.token }}"